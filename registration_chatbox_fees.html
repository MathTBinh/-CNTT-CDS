<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbox Trung Tâm Minh Tâm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .chat-header {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            text-align: center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        #chatBody {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .chat-message {
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            max-width: 70%;
        }
        .user-message {
            background-color: #007BFF;
            color: white;
            margin-left: auto;
        }
        .bot-message {
            background-color: #e9ecef;
            color: black;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        #userInput {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        button {
            padding: 5px 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    let awaitingMoreInfo = null;

    async function displayBotMessage(message) {
        const chatBody = document.getElementById("chatBody");
        const botMessage = document.createElement("div");
        botMessage.className = "chat-message bot-message";
        botMessage.innerHTML = message;
        chatBody.appendChild(botMessage);
        chatBody.scrollTop = chatBody.scrollHeight;
        document.getElementById("userInput").value = "";
    }

    async function sendMessage() {
        const userInput = document.getElementById("userInput").value.trim().toLowerCase();
        if (!userInput) return;

        const chatBody = document.getElementById("chatBody");
        const userMessage = document.createElement("div");
        userMessage.className = "chat-message user-message";
        userMessage.textContent = userInput;
        chatBody.appendChild(userMessage);

        let botReply = "Vui lòng cung cấp đủ thông tin: môn học và lớp học (ví dụ: Toán lớp 6)?";

        // Xử lý câu hỏi đang chờ thông tin bổ sung
        if (awaitingMoreInfo) {
            const classMatch = userInput.match(/lớp\s*(tiểu học|\d+)/i) || userInput.match(/\s*(\d+)/i);
            const subjectMatch = userInput.match(/toán|toan|văn|van|tiếng anh|tieng anh|kỹ năng sống|toán tư duy|tiếng anh giao tiếp|khoa học tự nhiên|lý|hóa/i);
            const classLevel = classMatch ? (classMatch[1].toLowerCase() === "tiểu học" ? "tiểu học" : `lớp ${classMatch[1]}`) : null;
            const subject = subjectMatch ? subjectMatch[0] : null;

            if (classLevel && subject && centerDatabase[classLevel] && centerDatabase[classLevel].subjects.includes(subject)) {
                botReply = `**Môn học**: ${subject.charAt(0).toUpperCase() + subject.slice(1)} (${classLevel})<br>` +
                          `**Lịch học**: ${centerDatabase[classLevel].schedule[subject]}<br>` +
                          `**Học phí**: ${centerDatabase[classLevel].fees[subject]}<br>` +
                          `**Hướng dẫn đăng ký**: ${centerDatabase[classLevel].registration}`;
                awaitingMoreInfo = null;
            } else {
                botReply = "Vui lòng cung cấp đúng môn học và lớp học (ví dụ: Toán lớp 6).";
            }
            await displayBotMessage(botReply);
            return;
        }

        // Nhận diện câu hỏi trực tiếp
        const classMatch = userInput.match(/lớp\s*(tiểu học|\d+)/i) || userInput.match(/\s*(\d+)/i);
        const subjectMatch = userInput.match(/toán|toan|văn|van|tiếng anh|tieng anh|kỹ năng sống|toán tư duy|tiếng anh giao tiếp|khoa học tự nhiên|lý|hóa/i);
        const classLevel = classMatch ? (classMatch[1].toLowerCase() === "tiểu học" ? "tiểu học" : `lớp ${classMatch[1]}`) : null;
        const subject = subjectMatch ? subjectMatch[0] : null;

        if (classLevel && subject && centerDatabase[classLevel] && centerDatabase[classLevel].subjects.includes(subject)) {
            botReply = `**Môn học**: ${subject.charAt(0).toUpperCase() + subject.slice(1)} (${classLevel})<br>` +
                      `**Lịch học**: ${centerDatabase[classLevel].schedule[subject]}<br>` +
                      `**Học phí**: ${centerDatabase[classLevel].fees[subject]}<br>` +
                      `**Hướng dẫn đăng ký**: ${centerDatabase[classLevel].registration}`;
        } else {
            botReply = "Vui lòng cung cấp đủ thông tin: môn học và lớp học (ví dụ: Toán lớp 6)?";
            awaitingMoreInfo = { type: "registration" };
        }

        await displayBotMessage(botReply);
    }

    document.getElementById("userInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
