<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký học - MINHTAMEDUCATION</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #c62828;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background-color: #c62828;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng ký tư vấn - học tại MINH TÂM</h2>
        <form id="popupRegisterForm">
            <label>Họ tên học sinh</label>
            <input type="text" name="name" required>

            <label>Số điện thoại</label>
            <input type="tel" name="phone" required>

            <label>Lớp</label>
            <input type="text" name="grade" required placeholder="VD: 6, 10, 12...">

            <label>Môn</label>
            <input type="text" name="subject" required placeholder="Toán, Lý, Hóa...">

            <button type="submit">Gửi thông tin</button>
        </form>
    </div>

    <script>
        document.getElementById("popupRegisterForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const form = e.target;
            const data = {
                name: form.name.value,
                phone: form.phone.value,
                grade: form.grade.value,
                subject: form.subject.value
            };

            // Gửi đến Google Sheets
            const googleSheetsPromise = fetch("https://script.google.com/macros/s/AKfycbzGM6PQT2rxPym-P9I8XlqTL4Yp3MhVPMKVYH1EfnMEFmS3jrR1j3qjHtQGU0gl3egv/exec", {
                method: "POST",
                body: JSON.stringify(data)
            });

            // Gửi đến Telegram
            const telegramPromise = fetch(`https://api.telegram.org/bot8240637801:AAExl0vkqP4fXXE_D2seiLrKJxCAb3C5FnE/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: '-4832541970',
                    text: `🎯 *THÔNG TIN ĐĂNG KÝ MỚI*\n\n├ Họ tên: ${data.name}\n├ Điện thoại: [${data.phone}](tel:${data.phone})\n├ Lớp: ${data.grade}\n└ Môn học: ${data.subject}`,
                    parse_mode: 'Markdown'
                })
            });

            Promise.all([googleSheetsPromise, telegramPromise])
                .then(() => {
                    alert("✅ Đăng ký thành công! Trung tâm sẽ liên hệ sớm.");
                    form.reset();
                })
                .catch(err => {
                    alert("❌ Gửi thất bại. Vui lòng thử lại.");
                });
        });
    </script>
</body>
</html>
